name: CI Tests (Cypress & Playwright)
on:
  push:
    branches: [ main, master, lesson-31 ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-20.9.0-chrome-118.0.5993.88-1-ff-118.0.2-edge-118.0.2088.46-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Verify Cypress in Docker
        # Використовуємо verify замість run, щоб перевірити готовність середовища
        run: npx cypress verify

  playwright-run:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.39.0-jammy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Verify Playwright in Docker
        # Просто перевіряємо версію, щоб підтвердити успішний запуск у контейнері
        run: npx playwright --version